<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent-Host · Workspace</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/pages.css">
  <script src="/theme.js"></script>
  <script src="/workspace.js" defer></script>
  <script src="/shortcuts.js" defer></script>
</head>
<body data-page="workspace">
  <aside class="rail">
    <a class="brand agh-brand" href="#memory" aria-label="AGH 首页"><img src="/logo.svg" width="40" height="40" alt="AGH"></a>
    <nav aria-label="主导航">
      <a href="#memory" data-view="memory"><span>◇</span>记忆</a>
      <a href="#executions" data-view="executions"><span>≋</span>记录</a>
    </nav>
    <a class="settings-link" href="#settings" data-view="settings"><span>⚙</span>设置</a>
    <span class="local-indicator" title="本地模式">●</span>
  </aside>
  <main>
    <header class="topbar"><div><strong>AGH</strong><span class="divider">/</span><span id="view-title">记忆图谱</span><span class="beta">PREVIEW</span></div><div class="header-actions"><span id="connection">本地模式</span><label class="theme-picker"><span>外观</span><select data-theme-picker aria-label="外观主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="close-chat" class="close-chat" type="button" aria-label="关闭当前聊天" aria-keyshortcuts="Meta+W" title="关闭当前聊天 (⌘W)" hidden>关闭聊天 <kbd>⌘W</kbd></button><button id="chat-toggle" aria-expanded="true" aria-controls="chat-panel">◧ Chat</button></div></header>
    <div class="studio">
      <section id="memory" class="view frame-view" hidden><iframe title="记忆图谱与记忆库" data-src="/memory.html"></iframe></section>
      <section id="executions" class="view frame-view" hidden><iframe title="执行记录与证据" data-src="/executions.html"></iframe></section>
      <section id="settings" class="view frame-view" hidden><iframe title="Agent-Host 设置" data-src="/settings.html"></iframe></section>
      <aside id="chat-panel" class="chat-panel" aria-label="Chat 草稿">
        <div class="chat-heading"><div><strong>Chat</strong><small>为下一次工作准备上下文</small></div><span class="draft-badge">草稿</span></div>
        <div class="chat-context"><span>◈</span><div><strong id="context-title">新的工作</strong><small id="context-subtitle">草稿自动保存在当前浏览器</small></div></div>
        <div class="chat-body"><div class="assistant-mark">✳</div><h2>工作从这里继续。</h2><p>一边查看记忆、执行记录或设置，一边准备下一步。草稿始终留在这里。</p><div class="chat-prompts" aria-label="任务起点"><button data-prompt="帮我整理这个项目的当前进展和下一步。">↗ 整理项目进展</button><button data-prompt="查找与当前任务有关的记忆，并列出来源。">◇ 找回相关记忆</button><button data-prompt="帮我检查 Agent、模型和渠道配置。">⚙ 检查工作配置</button></div></div>
        <div class="composer"><label for="draft">任务草稿</label><textarea id="draft" placeholder="你想一起完成什么？" rows="5"></textarea><div class="composer-actions"><button id="clear-draft">清空</button><button id="save-draft" class="primary">保存草稿 ↓</button></div><p id="draft-status" role="status">仅保存到此浏览器，不会执行任务。</p></div>
      </aside>
    </div>
  </main>
</body>
</html>
