<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent-Host · Workspace</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/pages.css">
  <script src="/theme.js"></script>
  <script src="/workspace.js" defer></script>
  <script src="/shortcuts.js" defer></script>
  <script src="/markdown-parser.js" defer></script>
  <script src="/markdown.js" defer></script>
  <script src="/chat.js" defer></script>
</head>
<body data-page="workspace">
  <aside class="rail">
    <a class="brand agh-brand" href="#memory" aria-label="AGH 首页"><img src="/logo.svg" width="40" height="40" alt="AGH"></a>
    <nav aria-label="主导航">
      <a href="#memory" data-view="memory"><span>◇</span>记忆</a>
      <a href="#executions" data-view="executions"><span>≋</span>记录</a>
    </nav>
    <a class="settings-link" href="#settings" data-view="settings"><span>⚙</span>设置</a>
    <span class="local-indicator" title="本地模式">●</span>
  </aside>
  <main>
    <header class="topbar"><div><strong>AGH</strong><span class="divider">/</span><span id="view-title">记忆图谱</span><span class="beta">PREVIEW</span></div><div class="header-actions"><span id="connection">本地模式</span><label class="theme-picker"><span>外观</span><select data-theme-picker aria-label="外观主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="close-chat" class="close-chat" type="button" aria-label="关闭当前聊天" aria-keyshortcuts="Meta+W" title="关闭当前聊天 (⌘W)" hidden>关闭聊天 <kbd>⌘W</kbd></button><button id="chat-toggle" aria-expanded="true" aria-controls="chat-panel">◧ Chat</button></div></header>
    <div class="studio">
      <section id="memory" class="view frame-view" hidden><iframe title="记忆图谱与记忆库" data-src="/memory.html"></iframe></section>
      <section id="executions" class="view frame-view" hidden><iframe title="执行记录与证据" data-src="/executions.html"></iframe></section>
      <aside id="chat-panel" class="chat-panel" aria-label="Chat 对话">
        <div class="chat-heading"><div class="chat-identity"><img src="/logo.svg" width="30" height="30" alt=""><div><strong>Chat <span class="draft-badge">本地执行</span></strong><small>原生输出，实时可见</small></div></div><button id="new-chat" type="button" class="chat-new">新对话</button><button id="panel-close" class="chat-icon-button" type="button" aria-label="收起 Chat" title="收起 Chat (⌘W)">×</button></div>
        <div id="chat-agent-bar" class="chat-agent-bar" hidden><label for="chat-agent">智能体</label><select id="chat-agent" aria-label="Chat 智能体" title="切换智能体会保留各自的对话；只列出当前 Web 连接中的本地智能体。"></select></div>
        <div id="chat-scroll" class="chat-body"><div id="chat-welcome"><div class="assistant-mark" aria-hidden="true">✳</div><h2>有什么想一起完成？</h2><p>先记下想法，或从一个小问题开始。</p><div class="chat-prompts" aria-label="任务起点"><button data-prompt="帮我整理这个项目的当前进展和下一步。"><span aria-hidden="true">↗</span>整理项目进展<span class="prompt-add" aria-hidden="true">＋</span></button><button data-prompt="查找与当前任务有关的记忆，并列出来源。"><span aria-hidden="true">◇</span>找回相关记忆<span class="prompt-add" aria-hidden="true">＋</span></button><button data-prompt="帮我检查 Agent、模型和渠道配置。"><span aria-hidden="true">⚙</span>检查工作配置<span class="prompt-add" aria-hidden="true">＋</span></button></div><p class="chat-boundary" id="chat-notice">正在连接执行环境…</p></div><div id="chat-messages" aria-label="对话消息"></div><button id="latest-chat" type="button" hidden>↓ 回到最新</button></div>
        <div class="chat-compose-area"><div class="composer"><div class="composer-label"><label for="draft">消息</label><span id="draft-count" aria-hidden="true">0 字</span></div><textarea id="draft" placeholder="输入消息，Enter 发送…" rows="3" aria-describedby="draft-hint" spellcheck="false"></textarea><div class="composer-actions"><div><button id="clear-draft" type="button" class="draft-clear">清空</button><button id="undo-clear" type="button" class="draft-clear" hidden>撤销清空</button></div><button id="send-chat" type="button" class="primary" disabled title="发送 (Enter)，Shift+Enter 换行">发送 <span aria-hidden="true">↑</span></button><button id="stop-chat" type="button" class="chat-stop" hidden>■ 中止执行</button></div></div><div class="draft-feedback"><span id="draft-status" role="status" aria-live="polite">草稿自动保存</span><span id="chat-state" role="status" aria-live="polite"></span><span id="draft-hint">Enter 发送 · Shift+Enter 换行</span></div></div>
      </aside>
    </div>
  </main>
  <dialog id="settings-dialog" class="settings-modal" aria-label="设置"><button id="settings-close" class="settings-modal-close" type="button" aria-label="关闭设置" title="关闭设置 (Esc)">×</button><iframe title="Agent-Host 设置" data-src="/settings.html"></iframe></dialog>
</body>
</html>
